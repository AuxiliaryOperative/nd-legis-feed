name: Update ND Legislature enriched feed

on:
  schedule:
    - cron: '0 11 * * *'  # runs daily at 11:00 UTC (~6:00 AM Central time)
  workflow_dispatch: {}   # lets us trigger it manually to test, from the Actions tab

permissions:
  contents: write   # needed so this job can save its results back to the repo

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feed generator
        run: python generate_enriched_feed.py

      - name: Commit and push updated feed + cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml data/scraped_cache.json
          git diff --cached --quiet || git commit -m "Update enriched feed [automated]"
          git push
